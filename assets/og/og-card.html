<!DOCTYPE html>
<!-- Source for og-psi.png. This is a build input, not a page of the site.
     Re-render after editing:  see assets/og/README.md -->
<html lang="en-ZA">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<title>OG card source</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* tokens copied from index.html so the card cannot drift off-brand */
:root{
  --g-amber:#FFA24D; --g-orange:#F78918; --g-red:#FF6A1F;
  --g-grad:linear-gradient(100deg,var(--g-amber) 0%,var(--g-orange) 46%,var(--g-red) 100%);
  --ink:#060B18; --line-2:rgba(150,175,255,.20);
  --text:#EEF1F8; --text-2:#98A2BE; --text-3:#616C8A;
  --wa:#25D366; --wa-ink:#04240F;
  --disp:'Archivo',sans-serif; --body:'Instrument Sans',sans-serif; --mono:'IBM Plex Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:var(--ink);color:var(--text);
  font-family:var(--body);overflow:hidden;position:relative}
/* the same orange bloom the hero uses, so the card reads as the same surface */
.orb{position:absolute;border-radius:50%;filter:blur(100px);pointer-events:none}
.orb-1{width:620px;height:620px;background:var(--g-orange);opacity:.20;top:-230px;right:-150px}
.orb-2{width:460px;height:460px;background:#2A4DA8;opacity:.16;bottom:-220px;left:-160px}
.grid{position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(rgba(140,170,255,.05) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(140,170,255,.05) 1px,transparent 1px);
  background-size:80px 80px}
.inner{position:relative;z-index:1;height:100%;padding:64px 72px;display:flex;flex-direction:column}

.brandbar{display:flex;align-items:center;gap:14px}
.mark{width:46px;height:46px;border-radius:50%;background:url(../brand/gas-mark-transparent.png) center/cover}
.wordmark{font-family:var(--disp);font-weight:900;font-stretch:80%;font-size:27px;letter-spacing:.02em}
.psi{font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:.16em;color:#2B0A02;
  background:var(--g-grad);padding:6px 11px;border-radius:8px}
.rule{flex:1;height:1px;background:var(--line-2)}
.tag{font-family:var(--mono);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-3)}

h1{font-family:var(--disp);font-weight:900;font-stretch:78%;font-size:118px;line-height:.92;
  letter-spacing:-.02em;text-transform:uppercase;margin-top:auto}
h1 .hot{background:var(--g-grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:block}
p.sub{font-size:23px;line-height:1.45;color:var(--text-2);max-width:820px;margin-top:26px}
p.sub b{color:var(--text);font-weight:600}

.footer{margin-top:auto;padding-top:34px;display:flex;align-items:center;gap:18px}
.wa{display:inline-flex;align-items:center;gap:11px;background:linear-gradient(100deg,#3FE47E,#25D366 46%,#0FA45C);
  color:var(--wa-ink);font-weight:700;font-size:19px;padding:14px 24px;border-radius:999px}
.wa svg{width:21px;height:21px}
.url{font-family:var(--mono);font-size:18px;color:var(--text-3);margin-left:auto;letter-spacing:.04em}
</style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="grid"></div>

<div class="inner">
  <div class="brandbar">
    <div class="mark"></div>
    <div class="wordmark">GAS</div>
    <div class="psi">PSI</div>
    <div class="rule"></div>
    <div class="tag">Pre-Sales Intelligence</div>
  </div>

  <h1>Intent<span class="hot">Engineered</span></h1>

  <p class="sub"><b>Every ad click becomes a WhatsApp conversation.</b> Every conversation becomes
    an intent score. Only sales-ready leads reach your people.</p>

  <div class="footer">
    <span class="wa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L5 21l1.9-3.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
      </svg>
      Chat to us on WhatsApp
    </span>
    <span class="url">chat.gasmarketing.co.za</span>
  </div>
</div>
</body>
</html>
